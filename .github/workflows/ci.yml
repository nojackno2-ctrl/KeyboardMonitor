name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\KeyboardMonitor.csproj -r win-x64

      - name: Build
        run: dotnet build .\KeyboardMonitor.csproj -c Release --no-restore

      - name: Run regression tests
        run: dotnet run --project .\tests\KeyboardMonitor.Tests\KeyboardMonitor.Tests.csproj -c Release

      - name: Verify formatting
        run: dotnet format .\KeyboardMonitor.csproj whitespace --verify-no-changes --no-restore

      - name: Verify test formatting
        run: dotnet format .\tests\KeyboardMonitor.Tests\KeyboardMonitor.Tests.csproj whitespace --verify-no-changes --no-restore

      - name: Publish self-contained single-file executable
        if: github.event_name != 'pull_request'
        run: >-
          dotnet publish .\KeyboardMonitor.csproj -c Release -r win-x64
          --self-contained true --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o .\artifacts\publish\win-x64

      - name: Generate SHA-256 checksum
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $artifactPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\win-x64\KeyboardMonitor.exe'
          if (-not (Test-Path -LiteralPath $artifactPath)) {
            throw "Published executable not found: $artifactPath"
          }

          $hash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\win-x64\SHA256SUMS.txt'
          "$hash  KeyboardMonitor.exe" | Set-Content -LiteralPath $checksumPath -Encoding utf8

      - name: Upload published artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardMonitor-${{ github.ref_name }}
          path: .\artifacts\publish\win-x64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag matches VersionPrefix
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(.+)$') {
            throw "Tag '$tag' does not start with 'v'."
          }
          $tagVersion = $Matches[1]

          $csprojContent = Get-Content -Raw -LiteralPath '.\KeyboardMonitor.csproj'
          if ($csprojContent -notmatch '<VersionPrefix[^>]*>([^<]+)</VersionPrefix>') {
            throw "Could not find VersionPrefix in KeyboardMonitor.csproj."
          }
          $projectVersion = $Matches[1]

          if ($tagVersion -ne $projectVersion) {
            throw "Tag '$tag' (version '$tagVersion') does not match VersionPrefix '$projectVersion' in KeyboardMonitor.csproj. Release aborted."
          }

          Write-Host "Tag '$tag' matches VersionPrefix '$projectVersion'."

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyboardMonitor-${{ github.ref_name }}
          path: .\release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$env:RELEASE_TAG"
          --repo "$env:RELEASE_REPOSITORY"
          --title "KeyboardMonitor $env:RELEASE_TAG"
          --generate-notes
          .\release\KeyboardMonitor.exe .\release\SHA256SUMS.txt
